services:
  updatesite:
    build:
      context: .
      # Stamp the build so the footer and /api/v1/health report which image is
      # deployed: VERSION=1.2.0 docker compose up -d --build
      args:
        VERSION: ${VERSION:-dev}
        COMMIT: ${COMMIT:-none}
        BUILD_DATE: ${BUILD_DATE:-unknown}
    image: mti/updatesite:latest
    container_name: updatesite
    restart: unless-stopped

    ports:
      - "8080:8080"

    environment:
      SITE_TITLE: "软件更新中心"
      # SITE_SUBTITLE: "内部发布通道"
      # Absolute URL used in API responses behind a reverse proxy.
      # BASE_URL: "https://update.example.com"
      # Set a token to protect POST /api/v1/rescan.
      # RESCAN_TOKEN: "change-me"
      SCAN_INTERVAL: "15s"
      # CORS_ORIGIN: "*"
      # Set to "false" to remove the upload endpoint and page entirely.
      # UPLOAD_ENABLED: "true"
      # Largest accepted upload. Accepts plain bytes or a suffix.
      # MAX_UPLOAD: "2GiB"

    volumes:
      # The archive. Publish either by dropping <app-id>/<version>/ directories
      # in here, or through POST /api/v1/apps/{app}/upload.
      # Uploading needs write access, so this is mounted read-write. Add ":ro"
      # if you publish only by hand and want the container unable to write;
      # uploads will then fail with a clear "not writable" message.
      # Point this at your own path in production, for example
      # /srv/updates/apps:/data/apps
      - ./release/apps:/data/apps
      # Persists computed sha256 digests across restarts.
      - updatesite-cache:/var/cache/updatesite

    # The container runs as root so that archives with restrictive permissions
    # mount without surprises. The image has no shell and the archive is mounted
    # read-only; add `user: "65534:65534"` here to drop privileges anyway.

volumes:
  updatesite-cache:
