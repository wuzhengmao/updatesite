services:
  updatesite:
    build:
      context: .
      # Stamp the build so the footer and /api/v1/health report which image is
      # deployed: VERSION=1.2.0 docker compose up -d --build
      args:
        VERSION: ${VERSION:-dev}
        COMMIT: ${COMMIT:-none}
        BUILD_DATE: ${BUILD_DATE:-unknown}
    image: wuzm219/updatesite:latest
    container_name: updatesite
    restart: unless-stopped

    ports:
      # Host port on the left. The container listens on 80 and 443; switch to
      # "80:80" and "443:443" if nothing else on the host holds those ports.
      - "8080:80"
      - "8443:443"

    environment:
      SITE_TITLE: "软件更新中心"
      # SITE_SUBTITLE: "内部发布通道"
      # Time zone used for the build stamp in the footer and for the dates shown
      # on the site. The time zone database is embedded in the binary, so any
      # IANA name works. Defaults to UTC when unset.
      TZ: "Asia/Shanghai"
      # The address visitors actually use, e.g. https://update.example.com.
      # Leave it empty when a reverse proxy forwards X-Forwarded-Proto and
      # X-Forwarded-Host; the site then derives the address from the request.
      # Set it when the container is reached directly on a non-standard port
      # (see .env.example) — a container cannot see how its ports were mapped.
      BASE_URL: "${BASE_URL:-}"
      # Set a token to protect POST /api/v1/rescan.
      # RESCAN_TOKEN: "change-me"
      SCAN_INTERVAL: "15s"
      # CORS_ORIGIN: "*"
      # Secret the upload tokens are derived from. Without it the upload
      # endpoint and page are switched off entirely. Generate one with
      # "updatesite token -gen-secret" and keep it out of version control.
      UPLOAD_SECRET: "${UPLOAD_SECRET:-}"
      # Set to "false" to remove the upload endpoint and page entirely.
      # UPLOAD_ENABLED: "true"
      # Largest accepted upload. Accepts plain bytes or a suffix.
      # MAX_UPLOAD: "2GiB"

      # HTTPS on 443, alongside plain HTTP on 80. Generate the certificate
      # pair with ./scripts/self-signed-cert.sh (or drop in real ones).
      # If the files are missing the site still starts, logs why, and serves
      # plain HTTP only — it will not lock you out.
      TLS_CERT: "/certs/server.crt"
      TLS_KEY: "/certs/server.key"
      # Send plain HTTP visitors to HTTPS. /api/v1/health is exempt so the
      # container health probe keeps working.
      TLS_REDIRECT: "true"

    volumes:
      # The archive. Publish either by dropping <app-id>/<version>/ directories
      # in here, or through POST /api/v1/apps/{app}/upload.
      # Uploading needs write access, so this is mounted read-write. Add ":ro"
      # if you publish only by hand and want the container unable to write;
      # uploads will then fail with a clear "not writable" message.
      # Point this at your own path in production, for example
      # /srv/updates/apps:/data/apps
      - ./release/apps:/data/apps
      # Persists computed sha256 digests across restarts.
      - updatesite-cache:/var/cache/updatesite
      # TLS certificates, mounted read-only.
      # Run ./scripts/self-signed-cert.sh to create them for testing.
      - ./certs:/certs:ro

    # The container runs as root so that archives with restrictive permissions
    # mount without surprises. The image has no shell and the archive is mounted
    # read-only; add `user: "65534:65534"` here to drop privileges anyway.

volumes:
  updatesite-cache:
